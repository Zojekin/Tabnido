/* Native switch for this isolated UI prototype; no persistence or extension API. */
.toggle-switch{position:relative;display:block;width:38px;height:22px;flex:none;cursor:pointer}
.toggle-switch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.switch-track{display:block;width:38px;height:22px;border-radius:999px;background:#d9d9d9;border:1px solid #c5c5c5}
.switch-track::after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;background:#fff;border-radius:50%;box-shadow:0 1px 2px #0002}
.toggle-switch input:checked+.switch-track{background:#111;border-color:#111}

.status:has(.toggle-switch input:not(:checked)) .dot{background:#c83e45;box-shadow:0 0 0 3px #fbeef0}
